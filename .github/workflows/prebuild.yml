name: Prebuild & Publish WDA

# Runs only when a release is published by hand on GitHub: builds the
# prebuilt WebDriverAgentRunner artifacts (the same six zips the upstream
# Release workflow produces) from the release tag and attaches them, plus
# SHA256SUMS and BUILD_INFO.txt, to that release. The latest release is
# always reachable via releases/latest/download/<asset>.
#
# Builds are unsigned (CODE_SIGNING_ALLOWED=NO in Scripts/ci/build-*.sh); the
# runner is signed at install time.

on:
  release:
    types: [published]

concurrency:
  group: prebuild-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "16.4"
  DESTINATION_SIM: platform=iOS Simulator,name=iPhone 17
  DESTINATION_SIM_tvOS: platform=tvOS Simulator,name=Apple TV 4K (3rd generation)

jobs:
  build-real:
    name: Build ${{ matrix.scheme }} (real device)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: WebDriverAgentRunner
            destination: generic/platform=iOS
            derived_data: appium_wda_ios
            wd: appium_wda_ios/Build/Products/Debug-iphoneos
            zip: WebDriverAgentRunner-Runner.zip
          - scheme: WebDriverAgentRunner_tvOS
            destination: generic/platform=tvOS
            derived_data: appium_wda_tvos
            wd: appium_wda_tvos/Build/Products/Debug-appletvos
            zip: WebDriverAgentRunner_tvOS-Runner.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"
      - name: Build & zip ${{ matrix.scheme }}-Runner.app
        # Retried because simulator/device enumeration on fresh runners is
        # flaky (same reason the upstream Release workflow retries).
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: |
            export DERIVED_DATA_PATH="${{ matrix.derived_data }}"
            export SCHEME="${{ matrix.scheme }}"
            export DESTINATION="${{ matrix.destination }}"
            export WD="${{ matrix.wd }}"
            export ZIP_PKG_NAME="${{ matrix.zip }}"
            sh "$GITHUB_WORKSPACE/Scripts/ci/build-real.sh"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-Runner
          path: ${{ matrix.zip }}
          if-no-files-found: error

  build-sim:
    name: Build WebDriverAgentRunner${{ matrix.target }} sim (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ""
            arch: x86_64
            sim_dir: Debug-iphonesimulator
          - target: ""
            arch: arm64
            sim_dir: Debug-iphonesimulator
          - target: "_tvOS"
            arch: x86_64
            sim_dir: Debug-appletvsimulator
          - target: "_tvOS"
            arch: arm64
            sim_dir: Debug-appletvsimulator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"
      - name: Build & zip WebDriverAgentRunner${{ matrix.target }} (simulator)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: |
            export SCHEME="WebDriverAgentRunner${{ matrix.target }}"
            export ARCHS="${{ matrix.arch }}"
            export ZIP_PKG_NAME="WebDriverAgentRunner${{ matrix.target }}-Build-Sim-${{ matrix.arch }}.zip"
            export DERIVED_DATA_PATH="wda_build"
            export WD="wda_build/Build/Products/${{ matrix.sim_dir }}"
            export DESTINATION="$DESTINATION_SIM${{ matrix.target }}"
            sh "$GITHUB_WORKSPACE/Scripts/ci/build-sim.sh"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner${{ matrix.target }}-Build-Sim-${{ matrix.arch }}
          path: WebDriverAgentRunner${{ matrix.target }}-Build-Sim-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    name: Publish to GitHub Releases
    needs: [build-real, build-sim]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS and BUILD_INFO
        working-directory: dist
        run: |
          set -eu
          VERSION="${{ github.event.release.tag_name }}"
          sha256sum -- *.zip > SHA256SUMS
          {
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "event=${{ github.event_name }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD_INFO.txt
          echo "----- dist/ -----"; ls -la
          echo "----- SHA256SUMS -----"; cat SHA256SUMS
          echo "----- BUILD_INFO.txt -----"; cat BUILD_INFO.txt

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
